<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SARP YED Demo</title>
<style>
:root{
  --forest:#1B5E20;--green:#2E7D32;--green-50:#EEF6EB;--ink:#1C2B1E;--muted:#5B6B5D;--line:#D5DED3;--bg:#F6F8F5;--card:#FFFFFF;
  --amber:#E07B00;--amber-50:#FFF3E2;--blue:#1565C0;--blue-50:#EAF1FB;--purple:#6A3FA0;--purple-50:#F2EDF8;--red:#C62828;--red-50:#FCECEC;--grey-50:#F1F3F0;
  --radius:10px;--shadow:0 1px 2px rgba(20,40,20,.06),0 2px 8px rgba(20,40,20,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --forest:#7BC67F;--green:#81C784;--green-50:#1E2B1F;--ink:#E6EDE6;--muted:#A3B1A4;--line:#33413A;--bg:#121814;--card:#1A221C;
  --amber:#FFB74D;--amber-50:#2E2516;--blue:#64B5F6;--blue-50:#16222F;--purple:#B39DDB;--purple-50:#231C2E;--red:#EF7070;--red-50:#2E1A1A;--grey-50:#202822;}}
:root[data-theme="dark"]{--forest:#7BC67F;--green:#81C784;--green-50:#1E2B1F;--ink:#E6EDE6;--muted:#A3B1A4;--line:#33413A;--bg:#121814;--card:#1A221C;
  --amber:#FFB74D;--amber-50:#2E2516;--blue:#64B5F6;--blue-50:#16222F;--purple:#B39DDB;--purple-50:#231C2E;--red:#EF7070;--red-50:#2E1A1A;--grey-50:#202822;}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--forest);color:#fff}
:root[data-theme="dark"] header.top{background:#143d17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#143d17}}
.brand{display:flex;flex-direction:column;line-height:1.15}
.logos{display:flex;align-items:center;gap:8px}.logos img{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px}.logos img[hidden]{display:none}
.logo-slot{border:2px dashed var(--line);border-radius:10px;height:110px;display:flex;align-items:center;justify-content:center;background:var(--grey-50);margin-bottom:8px}.logo-slot img{max-height:96px;max-width:100%}
.brand b{font-size:16px}.brand span{font-size:11.5px;opacity:.85}
.demo-badge{white-space:nowrap;background:#FFC46B;color:#3a2600;font-weight:700;font-size:11px;padding:3px 8px;border-radius:20px;letter-spacing:.3px}
.spacer{flex:1}
.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 8px}
.top select option{color:#1C2B1E}
.top .who{font-size:12px;text-align:right;line-height:1.2}
.top .icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:14px 10px}
nav.side button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav.side button:hover{background:var(--grey-50)}
nav.side button.active{background:var(--green-50);color:var(--forest);font-weight:600}
nav.side .count{background:var(--grey-50);border-radius:20px;font-size:11px;padding:1px 7px;color:var(--muted)}
nav.side .sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 10px 6px}
main{padding:20px 24px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px;color:var(--forest)}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
[hidden]{display:none!important}a.btn{text-decoration:none;display:inline-flex;align-items:center}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:700;color:var(--forest);line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--grey-50)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--green-50)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.s01{background:var(--green-50);color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.s02{background:var(--amber-50);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.s03{background:var(--blue-50);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.s04{background:var(--purple-50);color:var(--purple);border-color:color-mix(in srgb,var(--purple) 30%,transparent)}
.s05{background:var(--red-50);color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.sok{background:var(--green);color:#fff}.sx{background:var(--grey-50);color:var(--muted);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--card)}
.field textarea{min-height:64px;resize:vertical}
.field .err{color:var(--red);font-size:12px}
.req::after{content:" *";color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tabs button.active{color:var(--forest);border-bottom-color:var(--green)}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.warnc{color:var(--amber);font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--grey-50);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--green)}
.hbar{display:grid;grid-template-columns:205px 1fr 36px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.note{background:var(--amber-50);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:8px;padding:10px 12px;font-size:13px}
.info{background:var(--blue-50);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:8px;padding:10px 12px;font-size:13px}
.muted{color:var(--muted)}.small{font-size:12px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px}
.mask{letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:12px;max-width:760px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{color:var(--forest)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--forest);color:#fff;padding:10px 14px;border-radius:8px;z-index:60;box-shadow:var(--shadow);max-width:380px}
.json{background:var(--grey-50);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:Consolas,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word}
mark{background:#FFE08A;color:#3a2600;border-radius:3px;padding:0 2px}
.fin td,.fin th{padding:5px 8px;font-size:12.5px}
.fin input{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card);text-align:right}
.fin input.t{text-align:left}
.fin select{border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--card)}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.stepper span{font-size:11px;padding:3px 7px;border-radius:12px;background:var(--grey-50);color:var(--muted)}
.stepper span.done{background:var(--green-50);color:var(--green)}
.stepper span.cur{background:var(--green);color:#fff}
.key{width:64px;height:64px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;background:var(--green-50);border:2px dashed var(--green);font-size:28px;cursor:pointer}
@media (max-width:900px){.logos img{height:30px}header.top{flex-wrap:wrap;gap:8px;padding:10px 14px}.brand span{display:none}.top select{flex:1;min-width:0}.spacer{display:none}.hbar{grid-template-columns:150px 1fr 30px}.layout{grid-template-columns:1fr}nav.side{display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav.side .sec{display:none}nav.side button{white-space:nowrap;width:auto}.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}main{padding:16px}.top .who{display:none}.kv{grid-template-columns:120px 1fr}}
</style>
</head>

function finCalc(f, cfg) {

  const G = inv.filter((l) => l.src === "G").reduce((a, l) => a + l.total, 0);
  const O = inv.filter((l) => l.src === "O").reduce((a, l) => a + l.total, 0);

  let bal = P; const yi = Array(n).fill(0), yp = Array(n).fill(0);
  for (let m = 0; m < N; m++) { const int = bal * r, pr = pmt - int; bal -= pr; const y = Math.floor(m / 12); if (y < n) { yi[y] += int; yp[y] += pr; } }
  for (let y = 0; y < n; y++) {

    OC[y] = f.opex.reduce((a, l) => a + (+l.y[y] || 0), 0);

    cfg.projectRule === "fixed"

// ======================================================================
function docsFor(a) { return DOCS.filter((d) => docApplies(a, d)); }
function gateCheck(a, gate) {
  const items = docsFor(a).filter((d) => d.gate <= gate);
  const need = gate === 4 ? ["Verified"] : ["Uploaded", "Under review", "Verified"];
  const missing = items.filter((d) => !need.includes((a.docs[d.k] || {}).status));
  return { ok: missing.length === 0, missing };
}
function eligibility(a, existing) {
  const fails = [];
  const age = ageFrom(a.dob, new Date(a.regDate || today()));
  if (age < DB.cfg.ageMin || age > DB.cfg.ageMax) fails.push(`E1 Age ${age} is outside the youth band ${DB.cfg.ageMin}–${DB.cfg.ageMax}`);
  const dup = existing.find((x) => x !== a && x.nic === a.nic);
  if (dup) fails.push(`E3 NIC already exists on record ${dup.id || dup.rec} (possible duplicate or data-entry error)`);
  return fails;
}
function proposalChecks(a) {
  const c = [];
  const secOk = SECTIONS.every(([n]) => a.sections[n] && a.sections[n].confirmed);
  c.push({ ok: secOk, t: "Sections 2–7 reviewed and confirmed by the freelancer" });
  const f = a.fin ? finCalc(a.fin, DB.cfg) : null;
  c.push({ ok: !!f && f.pass, t: "Funding check F1–F4 passes (Section 8)" });
  c.push({ ok: (a.gov || []).length > 0, t: "Section 10 recommendations recorded" });
  c.push({ ok: !!a.bank, t: "Bank details captured" });
  const g = gateCheck(a, 3);
  c.push({ ok: g.ok, t: "Gate G3: all documents due by G3 uploaded" + (g.ok ? "" : " (missing: " + g.missing.map((d) => d.name).join("; ") + ")") });
  return c;
}
function releaseChecks(a) {
  const g = gateCheck(a, 4);
  return [
    { ok: g.ok, t: "Gate G4: every applicable document Verified" + (g.ok ? "" : " (" + g.missing.length + " not verified)") },
    { ok: (a.gov || []).every((x) => x.status !== "Pending"), t: "Required Section 10 recommendations Received" },
    { ok: !!a.bank, t: "Bank details captured (verified with bank confirmation)" },
  ];
}
function approvalChecks(a) {
  const f = a.fin ? finCalc(a.fin, DB.cfg) : null;
  return [
    { ok: gateCheck(a, 4).ok, t: "All documents verified (G4)" },
    { ok: !!f && f.checks[0].ok, t: "Funding balanced (F1)" },
    { ok: !!f && f.checks[1].ok, t: "Grant within limit (F2)" },
    { ok: (a.gov || []).every((x) => x.status !== "Pending"), t: "Section 10 complete" },
    { ok: !!(a.bank && a.bank.verified), t: "Bank details verified" },
    { ok: true, t: `Segregation of duties: ${me().user} did not prepare, verify or solely interview this application` },
  ];
}
function actionsFor(a) {
  const s = a.status, A = [];
  const add = (key, label, kind, roles) => { if (roles.includes(role)) A.push({ key, label, kind }); };
  if (s === "DRF") add("complete", "Complete registration", "primary", ["FO"]);
  if (s === "ELR") { add("correct", "Correct data and re-check", "primary", ["FO"]); add("confirmIne", "Confirm ineligible", "warn", ["ST"]); add("returnFO", "Return to Field Officer to correct", "", ["ST"]); }
  if (s === "INE") add("reopen", "Reopen eligibility review", "", ["MG", "ST"]);
  if (["REG", "HLD"].includes(s)) add("schedule", "Schedule interview", "primary", ["ST"]);
  if (s === "ISC") add("interview", "Open interview form A–F", "primary", ["ST", "FO"]);
  if (s === "INT") add("score", "Scorecard and decision", "primary", ["ST"]);
  if (s === "SHL" && a.consultConsent !== "No") add("assign", "Assign to freelancer", "primary", ["ST"]);
  if (s === "SHL" && a.consultConsent === "No" && !a.pmuRoute) add("pmuRoute", "Refer to SARP PMU (no Indo-Lanka consultancy)", "primary", ["ST", "MG"]);
  if (["ASG", "PIP", "RFC"].includes(s)) { add("proposal", "Work on proposal", "primary", ["FL"]); add("submitVer", "Submit for verification", "", ["FL"]); }
  if (s === "UVR") { add("docs", "Verify documents", "primary", ["RV"]); add("release", "Release to management", "", ["RV"]); add("returnRV", "Return for correction", "warn", ["RV"]); }
  if (s === "PMA") { add("approve", "Approve (security key)", "primary", ["MG"]); add("returnMG", "Return for correction", "warn", ["MG"]); }
  if (s === "AFS") { add("package", "View final application", "", ["SL", "MG", "PMU"]); add("submit", "Record submission to SARP", "primary", ["SL"]); }
  if (["SUB", "USR"].includes(s)) { add("stage", "Record review stage", "primary", ["GO", "SL", "PMU"]); add("decision", "Record Committee decision", "primary", ["PMU", "SL"]); }
  if (["SUB", "USR", "SAP", "SRJ"].includes(s)) add("package", "View final application", "", ["SL", "MG", "PMU", "GO"]);
  if (!CLOSED.includes(s) && !["AFS", "SUB", "USR", "SAP"].includes(s)) add("withdraw", "Withdraw application", "", ["FO", "ST"]);
  return A;
}

function scoreTotal(scores) {
  const members = Object.keys(scores);
  const avg = SCORE.map((_, i) => members.reduce((s, m) => s + scores[m][i], 0) / members.length);
  const weighted = avg.map((v, i) => SCORE[i][2] * v / 5);
  return { avg, weighted, total: Math.round(weighted.reduce((a, b) => a + b, 0) * 10) / 10 };
}
